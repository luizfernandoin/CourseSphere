name: AppSec & SRE Continuous Verification Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  sast-analysis:
    name: SAST Code Analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit SAST Scanner
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Execute Static Application Security Testing (SAST)
        run: |
          bandit -r backend -ll -ii -x backend/tests/

  dependency-audit:
    name: Software Composition Analysis (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln CVE-2024-0000 || true

  test-suite:
    name: Automated Regression & Reliability Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare Test Environment & Fixtures
        run: |
          cp backend/credentials.dummy.json backend/credentials.json
          mkdir -p /tmp/cournell-course-sphere-data /tmp/cornell-course-sphere-data
          python -c "import sqlite3; conn = sqlite3.connect('backend/roster_reviews.sqlite.db'); conn.execute('CREATE TABLE IF NOT EXISTS courses (id INTEGER PRIMARY KEY, name TEXT, section_id INTEGER, semester TEXT, department TEXT, instructor TEXT);'); conn.execute('CREATE TABLE IF NOT EXISTS course_descriptions (id INTEGER PRIMARY KEY, course_id INTEGER, description TEXT);'); conn.commit(); conn.close()"

      - name: Execute Pytest Suite (Unit, Hardening, SRE)
        env:
          REDIS_URL: redis://localhost:6379/0
          ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
          OPENAI_OFFLINE_MOCK: "true"
        run: |
          pytest backend/tests/ -v
