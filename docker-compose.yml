services:
  firebase-emulator:
    build:
      context: ./infra/firebase-emulator
      dockerfile: Dockerfile
    container_name: coursesphere-firebase-emulator
    ports:
      - "9099:9099" # Auth Emulator
      - "9000:9000" # Realtime Database Emulator
      - "4000:4000" # Emulator Suite Web UI
    networks:
      - coursesphere-net
    environment:
      - FIREBASE_PROJECT=coursesphere-8bd9a

  redis:
    image: redis:7-alpine
    container_name: coursesphere-redis
    ports:
      - "6379:6379"
    networks:
      - coursesphere-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coursesphere-backend-1
    depends_on:
      - firebase-emulator
      - redis
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-1
      - OPENAI_OFFLINE_MOCK=true
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099
      - FIREBASE_DATABASE_EMULATOR_HOST=firebase-emulator:9000
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
    networks:
      - coursesphere-net

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coursesphere-backend-2
    depends_on:
      - firebase-emulator
      - redis
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-2
      - OPENAI_OFFLINE_MOCK=true
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099
      - FIREBASE_DATABASE_EMULATOR_HOST=firebase-emulator:9000
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
    networks:
      - coursesphere-net

  load-balancer:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: coursesphere-load-balancer
    ports:
      - "5000:80"   # Proxies directly to round-robin cluster
      - "8080:80"   # Standard reverse proxy port
    depends_on:
      - backend-1
      - backend-2
    networks:
      - coursesphere-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coursesphere-frontend
    ports:
      - "3000:3000"
    depends_on:
      - load-balancer
    networks:
      - coursesphere-net

networks:
  coursesphere-net:
    driver: bridge
