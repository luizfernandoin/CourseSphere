user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Custom log format logging upstream address, latency and routing details
    log_format upstream_routing '$remote_addr - [$time_local] "$request" '
                                '$status $body_bytes_sent '
                                'rt=$request_time '
                                'upstream=$upstream_addr '
                                'upstream_status=$upstream_status '
                                'upstream_rt=$upstream_response_time '
                                'instance="$upstream_http_x_instance_id"';

    access_log /var/log/nginx/access.log upstream_routing;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream pool configuring Round-Robin load balancing between backend replicas
    upstream backend_upstream {
        # Round-robin algorithm is default in Nginx
        server backend-1:5000 max_fails=3 fail_timeout=10s;
        server backend-2:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        listen 8080;
        server_name localhost;

        # OWASP baseline security headers on reverse proxy
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Upstream-Server $upstream_addr always;

        location / {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;

            # Timeouts and retry behavior
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Dedicated health check for the load balancer itself
        location /lb-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","role":"load-balancer","algorithm":"round-robin"}';
        }
    }
}

